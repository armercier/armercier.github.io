{{- /* Looping, muted, autoplaying video (behaves like a GIF).
       Usage: {{< video src="clip.mp4" poster="clip.jpg" caption="..." portrait="true" >}} */ -}}
{{- $src := .Get "src" -}}
{{- $poster := .Get "poster" -}}
<figure class="video-figure{{ if eq (.Get "portrait") "true" }} portrait{{ end }}">
  <video autoplay loop muted playsinline preload="metadata"{{ with $poster }} poster="{{ . }}"{{ end }}>
    <source src="{{ $src }}" type="video/mp4">
  </video>
  {{- with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
